name: pipeline-ci
on:
  push: {paths: ["pipeline/**", "contracts/**", "config.yaml", "requirements.txt"]}
  pull_request: {paths: ["pipeline/**", "contracts/**", "config.yaml", "requirements.txt"]}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install pydantic pyyaml numpy pillow pytest ruff
      - run: ruff check pipeline --select E9,F63,F7,F82
      - run: pytest -q pipeline/tests
