<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // GitHub Pages SPA fallback, part 1: Pages serves this file for unknown paths (/story/3…).
      // Send the browser to the app root with the original path in ?p=, which
      // public/spa-redirect.js (loaded first by index.html) restores before the router starts.
      // For a project site (user.github.io/<repo>/) set segmentsToKeep = 1 and build with --base=/<repo>/.
      var segmentsToKeep = 0;
      var l = window.location;
      var parts = l.pathname.split('/');
      var base = parts.slice(0, 1 + segmentsToKeep).join('/');
      var rest = parts.slice(1 + segmentsToKeep).join('/');
      l.replace(l.protocol + '//' + l.host + base + '/?p=' + encodeURIComponent('/' + rest + l.search) + l.hash);
    </script>
  </head>
  <body></body>
</html>
