<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Dancing with the Rivers">
  <title>Dancing with the Rivers</title>
  <defs>
    <!-- the river is cut out of the hills (true negative space) -->
    <mask id="dwr-river" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">
      <rect width="120" height="120" fill="#fff"/>
      <path d="M68.5 62 C58 69 74 75 64 81 C58.5 84.5 62 88 57 92" fill="none" stroke="#000" stroke-width="6.5" stroke-linecap="round"/>
    </mask>
  </defs>
  <!-- Background badge for maximum contrast and visibility on both dark and light browser tabs -->
  <rect width="120" height="120" rx="28" fill="#F4F0E6"/>
  <g mask="url(#dwr-river)" fill="#1A22B4" stroke="#1A22B4" stroke-width="7" stroke-linejoin="round">
    <path d="M16 86 L48 30 L80 86 Z"/>
    <path d="M56 86 L80 46 L104 86 Z"/>
  </g>
  <g fill="none" stroke="#1A22B4" stroke-width="5.5" stroke-linecap="round">
    <path d="M15 100 q9 -6 18 0 t18 0 t18 0 t18 0 t18 0"/>
    <path d="M33 111 q9 -6 18 0 t18 0 t18 0" opacity=".65"/>
  </g>
</svg>
